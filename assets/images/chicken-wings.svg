<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sauceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <filter id="wingSh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="250" cy="380" rx="140" ry="18" fill="#000000" opacity="0.14"/>

  <!-- Wing Pair -->
  <g filter="url(#wingSh)">
    <!-- Back Wing -->
    <path d="M140 250 C120 180, 200 130, 270 170 C310 195, 330 250, 290 280 C240 310, 170 300, 140 250 Z" fill="#9A3412" transform="rotate(-15 220 220)"/>

    <!-- Front Wing (Saucy, shiny spicy glaze) -->
    <path d="M190 280 
             C150 210, 230 140, 320 180 
             C370 200, 390 260, 350 300 
             C310 340, 230 330, 190 280 Z" 
          fill="url(#sauceGrad)"/>

    <!-- Glaze Highlights -->
    <path d="M240 180 C290 170, 340 195, 350 230" stroke="#FDBA74" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M210 240 C250 270, 300 270, 330 285" stroke="#FED7AA" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Sesame seeds sprinkled -->
    <ellipse cx="260" cy="210" rx="3" ry="5" fill="#FEF3C7" transform="rotate(30 260 210)"/>
    <ellipse cx="290" cy="230" rx="3" ry="5" fill="#FEF3C7" transform="rotate(-20 290 230)"/>
    <ellipse cx="240" cy="250" rx="3" ry="5" fill="#FEF3C7" transform="rotate(45 240 250)"/>
    <ellipse cx="320" cy="250" rx="3" ry="5" fill="#FEF3C7" transform="rotate(10 320 250)"/>
    <ellipse cx="280" cy="270" rx="3" ry="5" fill="#FEF3C7" transform="rotate(-30 280 270)"/>

    <!-- Red chili flakes -->
    <circle cx="270" cy="200" r="2.5" fill="#EF4444"/>
    <circle cx="310" cy="220" r="3" fill="#EF4444"/>
    <circle cx="230" cy="235" r="2.5" fill="#DC2626"/>
    <circle cx="295" cy="265" r="2" fill="#EF4444"/>
  </g>
</svg>
